[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-coding-agent"
version = "0.1.0"
description = "Engineering foundation for an independent Python coding agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Project contributors" }]
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
agent = "src.main:main"
coding-agent = "src.main:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
